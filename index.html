<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2B1D14" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>%APP_NAME%</title>
    <style>
      /* Splash while JS loads: walnut background with the reel icon. */
      html, body { background: #1E140E; margin: 0; }
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #splash img { width: 96px; height: 96px; animation: s 2.4s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="splash" aria-hidden="true"><img src="favicon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
