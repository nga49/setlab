name: CI and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (with engine coverage)
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Mobile smoke tests (390x844)
        run: npx playwright test

      - uses: actions/setup-python@v7
        if: hashFiles('sync/requirements-dev.txt') != ''
        with:
          python-version: '3.11'

      - name: Sync tool tests (pytest)
        if: hashFiles('sync/requirements-dev.txt') != ''
        run: |
          python -m pip install -r sync/requirements-dev.txt
          python -m pytest sync/tests -q

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
